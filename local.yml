---
version: '3'

volumes:
  hirethon_template_local_postgres_data: {}
  hirethon_template_local_postgres_data_backups: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: hirethon_template_local_django
    container_name: hirethon_template_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/local/postgres/Dockerfile
    image: hirethon_template_local_postgres
    container_name: hirethon_temp late_local_postgres
    volumes:
      - hirethon_template_local_postgres_data:/var/lib/postgresql/data
      - hirethon_template_local_postgres_data_backups:/backups
    environment:
      - POSTGRES_DB=hirethon_template_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=amraz
    ports:
      - "5432:5432"

  redis:
    image: redis:6
    container_name: hirethon_template_local_redis

  celeryworker:
    <<: *django
    image: hirethon_template_local_celeryworker
    container_name: hirethon_template_local_celeryworker
    depends_on:
      - redis
      - postgres
      - django
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: hirethon_template_local_celerybeat
    container_name: hirethon_template_local_celerybeat
    depends_on:
      - redis
      - postgres
      - django
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: hirethon_template_local_flower
    container_name: hirethon_template_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
